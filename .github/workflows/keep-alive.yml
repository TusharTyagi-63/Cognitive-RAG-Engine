name: Render Keep-Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render Free Tier from going to sleep
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          echo "Pinging backend to keep it awake..."
          # Uses curl to hit the health endpoint
          # The -sS flag makes it silent but shows errors, -f fails on HTTP errors
          curl -f -sS "${{ secrets.RENDER_BACKEND_URL }}/api/v1/health" > /dev/null
          echo "Ping successful!"
